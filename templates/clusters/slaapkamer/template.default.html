<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#F5F0E8;color:#3D2E1E;font-family:'Plus Jakarta Sans',sans-serif;line-height:1.7;}
h1,h2,h3{letter-spacing:-0.02em;color:#1A1208;}
a{color:#3D5A3E;}
.container{max-width:1180px;margin:0 auto;padding:0 48px;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(61,90,62,0.1);border:1px solid rgba(61,90,62,0.2);color:#3D5A3E;font-size:12px;font-weight:700;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
.card{background:#fff;border:1px solid rgba(61,46,30,0.1);border-radius:16px;padding:22px;}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(200,184,154,0.5),transparent);margin:36px 0;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.highlight{background:rgba(61,90,62,0.06);border-left:3px solid #3D5A3E;padding:16px 20px;border-radius:0 8px 8px 0;margin:24px 0;font-size:14.5px;color:rgba(61,46,30,0.78);line-height:1.7;}
.check-list{list-style:none;display:flex;flex-direction:column;gap:10px;padding:0;}
.check-list li{position:relative;padding-left:26px;font-size:15px;line-height:1.6;}
.check-list li::before{content:'\2713';color:#3D5A3E;font-weight:700;position:absolute;left:0;top:0;}
.x-list{list-style:none;display:flex;flex-direction:column;gap:10px;padding:0;}
.x-list li{position:relative;padding-left:26px;font-size:15px;line-height:1.6;}
.x-list li::before{content:'\2212';color:#B85C38;font-weight:800;position:absolute;left:0;top:0;}
.faq-item{border-bottom:1px solid rgba(61,46,30,0.08);padding:18px 0;}
.faq-item h3{font-size:16px;font-weight:700;margin-bottom:8px;color:#1A1208;}
.faq-item p{font-size:14px;color:rgba(61,46,30,0.72);line-height:1.7;}
.tile{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid rgba(61,46,30,0.1);border-radius:14px;padding:16px 18px;transition:border-color .15s;}
.tile:hover{border-color:rgba(61,90,62,0.4);}
/* vergelijkingstabel: elke as krijgt bij elk merk dezelfde behandeling (raamwerk §3) */
.vgl{width:100%;border-collapse:collapse;font-size:14.5px;margin:20px 0;background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(61,46,30,0.1);}
.vgl th{text-align:left;padding:12px 14px;font-weight:800;font-size:13px;color:#1A1208;background:rgba(61,90,62,0.08);border-bottom:2px solid rgba(61,90,62,0.15);}
.vgl td{padding:11px 14px;border-bottom:1px solid rgba(61,46,30,0.08);vertical-align:top;}
.vgl tr:last-child td{border-bottom:none;}
.vgl td:first-child{font-weight:700;color:#1A1208;white-space:nowrap;}
/* segmentblok (raamwerk §4): profielen, waarvan er minstens één níét bij de duurste uitkomt */
.segment{background:#fff;border:1px solid rgba(61,46,30,0.1);border-radius:14px;padding:18px 20px;}
.segment h3{font-size:15px;font-weight:800;margin-bottom:6px;}
.segment p{font-size:14px;color:rgba(61,46,30,0.72);line-height:1.65;}
.bron{font-size:12px;color:rgba(61,46,30,0.45);margin-top:6px;}
@media(max-width:768px){.container{padding:0 20px;}.grid-3,.grid-2{grid-template-columns:1fr;}.vgl{font-size:13px;}.vgl th,.vgl td{padding:9px 10px;}}
/*a11y-focus*/:focus-visible{outline:3px solid #3D5A3E!important;outline-offset:2px;box-shadow:0 0 0 8px rgba(245,240,232,.85)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
