<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#F5F0E8;color:#3D2E1E;font-family:'Plus Jakarta Sans',sans-serif;line-height:1.7;}
h1,h2,h3{letter-spacing:-0.02em;color:#1A1208;}
a{color:#3D5A3E;}
.container{max-width:1200px;margin:0 auto;padding:0 24px;}
/* Leeskolom: zonder deze begrenzing liepen regels op een breed scherm over de
   volle 2000 px en werd de feitentabel uit elkaar getrokken. */
/* De kolom vult de container, net als op de homepage. Structuur mag de volle
   breedte hebben; lopende tekst niet — bij 1200px zou een regel ruim 140
   tekens tellen en dat leest niet. Vandaar een leesmaat op alinea's en
   lijsten, terwijl tabellen, kaarten, stroken en de donkere blokken de hele
   breedte pakken. */
.kolom{max-width:none;margin:0 auto;padding:26px 0 56px;}
.kolom>p,.kolom>ul:not(.bedrijven),.kolom>ol,.kolom>.noot,.kolom>h2+p,.kolom>details p{max-width:68ch;}
.kolom>h1,.kolom>h2{max-width:22ch;}
.kolom>h2{max-width:26ch;}
@media(min-width:1000px){.kolom>h1{max-width:16ch;}}

.kolom h2{margin:38px 0 12px;font-size:1.45rem;letter-spacing:-.02em;}
.kolom h3{margin:24px 0 6px;font-size:1.02rem;}
.kolom p{margin:0 0 14px;}
.kolom ul{margin:0 0 18px;padding-left:20px;}
.kolom li{margin-bottom:7px;line-height:1.65;}
@media(max-width:768px){.kolom{padding:18px 0 40px;}.kolom h2{margin:30px 0 10px;font-size:1.28rem;}}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(61,90,62,0.1);border:1px solid rgba(61,90,62,0.2);color:#3D5A3E;font-size:11px;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:20px;}
.card{background:#fff;border:1px solid rgba(61,46,30,0.1);border-radius:16px;padding:22px;}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(200,184,154,0.5),transparent);margin:36px 0;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.highlight{background:rgba(61,90,62,0.06);border-left:3px solid #3D5A3E;padding:16px 20px;border-radius:0 8px 8px 0;margin:24px 0;font-size:14px;color:rgba(61,46,30,0.75);line-height:1.7;}
.check-list{list-style:none;display:flex;flex-direction:column;gap:10px;padding:0;}
.check-list li{position:relative;padding-left:26px;font-size:15px;line-height:1.6;}
.check-list li::before{content:'¹3';color:#3D5A3E;font-weight:700;position:absolute;left:0;top:0;}
.x-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
.x-list li{display:flex;align-items:start;gap:10px;font-size:15px;line-height:1.55;}
.x-list li::before{content:'!';color:#B85C38;font-weight:800;flex-shrink:0;width:18px;height:18px;border-radius:50%;background:rgba(184,92,56,0.12);text-align:center;font-size:12px;line-height:18px;margin-top:1px;}
.faq-item{border-bottom:1px solid rgba(61,46,30,0.08);padding:18px 0;}
.faq-item h3{font-size:16px;font-weight:700;margin-bottom:8px;color:#1A1208;}
.faq-item p{font-size:14px;color:rgba(61,46,30,0.72);line-height:1.7;}
.tile{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid rgba(61,46,30,0.1);border-radius:14px;padding:16px 18px;transition:border-color .15s;}
.tile:hover{border-color:rgba(61,90,62,0.4);}
.cta-primary{display:inline-block;background:#3D5A3E;color:#F5F0E8;padding:15px 30px;border-radius:11px;font-weight:700;font-size:15.5px;text-decoration:none;box-shadow:0 2px 0 rgba(26,18,8,.14);transition:background .15s,transform .15s;}.cta-primary:hover{background:#2A4029;transform:translateY(-1px);}.cta-stil{display:inline-block;background:transparent;color:#3D5A3E;box-shadow:inset 0 0 0 1.5px #3D5A3E;padding:13px 22px;border-radius:11px;font-weight:700;font-size:14.5px;text-decoration:none;}.cta-stil:hover{background:rgba(61,90,62,.08);}
/* wandtabel: welke plug in welke wand — ruggengraat van het cluster */
.wand-tabel{width:100%;border-collapse:collapse;font-size:14.5px;margin:20px 0;background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(61,46,30,0.1);}
.wand-tabel th{text-align:left;padding:12px 14px;font-weight:800;font-size:13px;color:#1A1208;background:rgba(61,90,62,0.08);border-bottom:2px solid rgba(61,90,62,0.18);}
.wand-tabel td{padding:11px 14px;border-bottom:1px solid rgba(61,46,30,0.08);vertical-align:top;}
.wand-tabel tr:last-child td{border-bottom:none;}
.tool-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(61,46,30,0.08);}
.tool-row:last-child{border-bottom:none;}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;}
.pill-lenen{background:rgba(61,90,62,0.12);color:#3D5A3E;}
.pill-kopen{background:rgba(184,92,56,0.12);color:#8F4527;}
@media(max-width:768px){.container{padding:0 20px;}.grid-3,.grid-2{grid-template-columns:1fr;}.wand-tabel{font-size:13px;}.wand-tabel th,.wand-tabel td{padding:9px 10px;}}
/* projectpagina: vork, feitentabel, laag-B */
.vork{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0;}
.vork a{display:block;text-decoration:none;background:#fff;border:2px solid rgba(61,90,62,0.25);border-radius:16px;padding:20px 22px;transition:border-color .15s;}
.vork a:hover{border-color:#3D5A3E;}
.vork .vk-kop{font-weight:800;font-size:16px;color:#1A1208;margin-bottom:4px;}
.vork .vk-sub{font-size:13px;color:rgba(61,46,30,0.72);}
/* projectpagina-opmaak: rust in de kolom, cijfers die opvallen */
.kolom h1{font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.14;letter-spacing:-.03em;margin:8px 0 20px;}
.antwoord{position:relative;}
.antwoord strong:first-child{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#3D5A3E;margin-bottom:7px;}
/* het logboek als tijdlijn met een streep, niet als opsomming */
.kolom h2 + ul.log{list-style:none;padding-left:0;margin-top:14px;}
ul.log li{position:relative;padding:0 0 14px 22px;border-left:2px solid rgba(61,90,62,.22);margin:0;}
ul.log li:last-child{border-left-color:transparent;padding-bottom:0;}
ul.log li::before{content:'';position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:#3D5A3E;}
/* bedrijven- en winkellijsten: kaartjes in plaats van bullets */
ul.bedrijven{list-style:none;padding-left:0;display:grid;gap:8px;}
ul.bedrijven li{background:#fff;border:1px solid rgba(61,46,30,.1);border-radius:12px;padding:12px 15px;font-size:14px;margin:0;}
ul.bedrijven li strong{display:inline-block;}
.feit-tabel{width:100%;border-collapse:collapse;font-size:14.5px;margin:18px 0;background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(61,46,30,0.1);}
.feit-tabel th{text-align:left;padding:13px 16px;font-weight:700;font-size:13px;color:rgba(61,46,30,0.72);width:44%;border-bottom:1px solid rgba(61,46,30,0.08);vertical-align:top;}
.feit-tabel td{padding:13px 16px;border-bottom:1px solid rgba(61,46,30,0.08);}
.feit-tabel tr:last-child th,.feit-tabel tr:last-child td{border-bottom:none;}
.laagb{background:rgba(61,90,62,0.05);border:1px dashed rgba(61,90,62,0.35);border-radius:14px;padding:18px 20px;margin:14px 0;}
.laagb .lb-kop{font-weight:800;font-size:14px;color:#3D5A3E;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.laagb p{font-size:13.5px;color:rgba(61,46,30,0.72);line-height:1.65;margin:0;}
.fase-pill{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:999px;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;background:rgba(184,92,56,0.12);color:#8F4527;}
@media(max-width:640px){.vork{grid-template-columns:1fr;}}
/* wie meedoet: de zichtbare beloning voor de winkel die betaalde */
.deelnemer{display:inline-block;font-size:11.5px;font-weight:700;color:#3D5A3E;background:rgba(61,90,62,0.12);padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:middle;}
/* één handeling, direct onder het antwoord — niet 1900 px lager */
.startblok{background:#3D5A3E;color:#F5F0E8;border-radius:16px;padding:22px 24px;margin:20px 0 8px;}
.startblok p{margin:0 0 14px;font-size:15px;line-height:1.65;color:rgba(245,240,232,.88);}
.startblok strong{color:#fff;}
.startblok .cta-primary{background:#F5F0E8;color:#1A1208;box-shadow:0 2px 0 rgba(0,0,0,.18);}.startblok .cta-primary:hover{background:#fff;}
.startblok .klein{font-size:12.5px;color:rgba(245,240,232,.6);margin:12px 0 0;}
@media(max-width:768px){.startblok{padding:18px 18px;}.startblok .cta-primary{display:block;text-align:center;}}
/* het antwoord bovenaan: dit is waarvoor de bezoeker kwam */
.antwoord{background:#fff;border:2px solid rgba(61,90,62,0.3);border-radius:14px;padding:16px 18px;font-size:15.5px;line-height:1.7;}
/* losse kanttekening in de lopende tekst — blijft één alinea, geen flexcontainer */
.noot{font-size:14.5px;line-height:1.7;color:rgba(61,46,30,0.75);border-left:3px solid rgba(61,90,62,0.25);padding-left:14px;margin:16px 0;}
/* advieskaarten: kop op eigen regel, vinkje als chip */
.advies{list-style:none;display:flex;flex-direction:column;gap:12px;margin:18px 0;padding:0;}
.advies li{background:#fff;border:1px solid rgba(61,46,30,0.1);border-radius:14px;padding:16px 18px 16px 48px;position:relative;font-size:14.5px;line-height:1.65;color:rgba(61,46,30,0.75);}
.advies li::before{content:'\2713';position:absolute;left:16px;top:17px;width:21px;height:21px;border-radius:50%;background:rgba(61,90,62,0.12);color:#3D5A3E;font-weight:800;font-size:12px;text-align:center;line-height:21px;}
.advies li strong{display:block;color:#1A1208;font-size:15px;margin-bottom:3px;}
.kk-icon{width:38px;height:32px;flex:none;fill:none;stroke:#3D5A3E;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}

/* ── ontwerpronde 29 aug: ritme, hiërarchie en één hoofdactie ────────────── */
/* Hero: de kop gaat over de koper, de tekening staat ernaast. */
.pk-etiket{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#C2410C;font-weight:700;}
.pk-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:38px;align-items:center;margin:6px 0 4px;}
.pk-hero .intro{font-size:17px;line-height:1.65;color:rgba(61,46,30,.78);max-width:34ch;margin:10px 0 0;}
.pk-acties{display:flex;flex-wrap:wrap;gap:11px;align-items:center;margin-top:22px;}
.pk-onder{font-size:13px;color:rgba(61,46,30,.62);margin:11px 0 0;}
.pk-tekening{background:#fff;border:1px solid rgba(61,46,30,.12);border-radius:16px;padding:16px;position:relative;}
.pk-tekening svg{display:block;width:100%;height:auto;}
.pk-stempel{position:absolute;left:18px;bottom:12px;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(61,46,30,.55);}
@media(max-width:820px){.pk-hero{grid-template-columns:1fr;gap:22px;}}
/* Cijferstrook: ons bewijs, klein en terzijde in plaats van als eerste alinea. */
.pk-strook{display:flex;flex-wrap:wrap;border:1px solid rgba(61,46,30,.12);border-radius:13px;overflow:hidden;background:#fff;margin:26px 0 8px;}
.pk-strook div{flex:1 1 8rem;padding:14px 16px;border-right:1px solid rgba(61,46,30,.08);}
.pk-strook div:last-child{border-right:0;}
.pk-strook b{display:block;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;color:#1A1208;}
.pk-strook span{display:block;font-size:12px;color:rgba(61,46,30,.66);margin-top:2px;line-height:1.35;}
/* Tijdlijn: verstreken momenten grijs, het eerstvolgende gemarkeerd. */
.pk-tijdlijn{margin:20px 0 6px;}
.pk-moment{display:grid;grid-template-columns:9.5rem 1fr;gap:18px;padding:16px 0;border-top:1px solid rgba(61,46,30,.12);}
.pk-moment:last-child{border-bottom:1px solid rgba(61,46,30,.12);}
.pk-moment .wanneer{font-family:'Space Mono',monospace;font-size:12.5px;color:rgba(61,46,30,.62);padding-top:2px;}
.pk-moment h3{font-size:16px;font-weight:700;margin:0 0 3px;color:#1A1208;}
.pk-moment p{font-size:14px;color:rgba(61,46,30,.72);margin:0;line-height:1.6;}
.pk-moment.nu{background:rgba(194,65,12,.07);border-radius:11px;border-top-color:transparent;padding:16px;margin:0 -16px;}
.pk-moment.nu .wanneer{color:#C2410C;font-weight:700;}
.pk-nu-chip{display:inline-block;margin-left:9px;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:#C2410C;color:#fff;padding:2px 7px;border-radius:3px;vertical-align:2px;}
.pk-moment.klaar{opacity:.52;}
@media(max-width:640px){.pk-moment{grid-template-columns:1fr;gap:4px;}.pk-moment.nu{margin:0;}}
/* Vergelijkbalk: prijspeil naast het landelijk gemiddelde. */
.pk-verg{display:flex;flex-direction:column;gap:14px;margin:20px 0 0;max-width:44rem;}
.pk-verg .rij{display:grid;grid-template-columns:10rem 1fr 7rem;gap:14px;align-items:center;}
.pk-verg .naam{font-size:14px;color:rgba(61,46,30,.72);}
.pk-verg .baan{height:24px;background:rgba(61,46,30,.08);border-radius:5px;position:relative;overflow:hidden;}
.pk-verg .baan i{position:absolute;inset:0 auto 0 0;display:block;border-radius:5px;}
.pk-verg .hier{background:#3D5A3E;} .pk-verg .nl{background:rgba(61,46,30,.22);}
.pk-verg .cijfer{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;text-align:right;}
@media(max-width:700px){.pk-verg .rij{grid-template-columns:1fr;gap:4px;}.pk-verg .cijfer{text-align:left;}}
/* Bedrijfskaarten: aangesloten bedrijven zichtbaar anders. */
.pk-kaarten{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:12px;margin:18px 0 0;}
.pk-kaart{background:#fff;border:1px solid rgba(61,46,30,.12);border-radius:14px;padding:15px 17px 16px;}
.pk-kaart.mee{border-color:#3D5A3E;box-shadow:0 0 0 1px #3D5A3E;}
.pk-kaart .merk{display:inline-block;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:#3D5A3E;color:#F5F0E8;padding:2px 7px;border-radius:3px;}
.pk-kaart h3{margin:9px 0 2px;font-size:15.5px;font-weight:700;color:#1A1208;}
.pk-kaart .meta{font-size:13px;color:rgba(61,46,30,.66);}
.pk-kaart .aanbod{margin-top:11px;padding-top:11px;border-top:1px dashed rgba(61,46,30,.14);font-size:13.5px;line-height:1.55;}
/* Regisseur in een donker vlak: het menselijke moment verdient een eigen kleur. */
.pk-mens{background:#3D5A3E;color:#F1EDE4;border-radius:18px;padding:30px 32px;margin:18px 0 0;}
.pk-mens .kop{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
.pk-monogram{width:54px;height:54px;border-radius:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:19px;color:#fff;flex:none;}
.pk-mens h3{margin:0;font-size:18px;color:#fff;font-weight:700;}
.pk-mens .rol{font-size:13px;color:rgba(241,237,228,.7);}
.pk-mens p{color:rgba(241,237,228,.85);font-size:15px;line-height:1.68;margin:0 0 14px;}
.pk-mens .fijn{font-size:12.5px;color:rgba(241,237,228,.6);margin:14px 0 0;}
.pk-mens .cta-primary{background:#F5F0E8;color:#1A1208;box-shadow:0 2px 0 rgba(0,0,0,.18);}
.pk-mens .cta-primary:hover{background:#fff;}
@media(max-width:768px){.pk-mens{padding:22px 20px;}.pk-mens .cta-primary{display:block;text-align:center;}}
/* Vragen uitklapbaar in plaats van een muur tekst. */
.pk-vraag{border-top:1px solid rgba(61,46,30,.12);padding:15px 0;}
.pk-vraag:last-of-type{border-bottom:1px solid rgba(61,46,30,.12);}
.pk-vraag summary{cursor:pointer;font-weight:700;font-size:16px;color:#1A1208;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center;}
.pk-vraag summary::-webkit-details-marker{display:none;}
.pk-vraag summary::after{content:'+';font-family:'Space Mono',monospace;color:#3D5A3E;font-size:19px;line-height:1;flex:none;}
.pk-vraag[open] summary::after{content:'\2013';}
.pk-vraag p{font-size:14.5px;color:rgba(61,46,30,.74);line-height:1.7;margin:9px 0 0;max-width:46rem;}
/* Slot: één handeling, met lucht eromheen. */
.pk-slot{background:#2A4029;color:#F1EDE4;border-radius:18px;padding:38px 32px;text-align:center;margin:34px 0 0;}
.pk-slot h2{color:#fff;margin:6px 0 0;font-size:clamp(1.4rem,2.6vw,1.85rem);}
.pk-slot p{color:rgba(241,237,228,.84);max-width:34rem;margin:12px auto 0;font-size:15px;line-height:1.68;}
.pk-slot .cta-primary{background:#F5F0E8;color:#1A1208;margin-top:22px;box-shadow:0 2px 0 rgba(0,0,0,.2);}
.pk-slot .cta-primary:hover{background:#fff;}
.pk-slot .fijn{font-size:12.5px;color:rgba(241,237,228,.6);margin-top:14px;}
.pk-slot .pk-etiket{color:#C9DCC4;}
/*a11y-focus*/:focus-visible{outline:3px solid #3D5A3E!important;outline-offset:2px;box-shadow:0 0 0 8px rgba(245,240,232,.85)}@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}</style>
