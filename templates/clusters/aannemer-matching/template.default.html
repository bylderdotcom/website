<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#F5F0E8;--cream-2:#EDE6D8;--bark:#1A1208;--bark-2:#3D2E1E;--moss:#3D5A3E;--white:#fff;--border:rgba(61,46,30,0.1)}
body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--cream);color:var(--bark-2);line-height:1.65}
nav{background:rgba(245,240,232,0.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;position:fixed;top:0;left:0;right:0;z-index:100;padding:0 5%}
.ni{width:100%;max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.nl{display:flex;align-items:center;gap:10px;text-decoration:none}
.nli{width:32px;height:32px;border-radius:8px;background:#3D5A3E;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;font-family:"Space Mono",monospace;color:#F5F0E8}
.nls{font-weight:800;font-size:17px;letter-spacing:-0.02em;color:#1A1208}.dot{color:#3D5A3E}
.bp{background:#3D5A3E;color:#F5F0E8;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none}
.c{max-width:1060px;margin:0 auto;padding:0 5%}
.fi{border-bottom:1px solid var(--border)}
.fq{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:15px;font-weight:700;color:#1A1208;background:none;border:none;cursor:pointer;text-align:left;font-family:"Plus Jakarta Sans",sans-serif;gap:16px}
.fq:hover{color:#3D5A3E}
.fa{display:none;padding:0 0 16px;font-size:14px;color:#3D2E1E;line-height:1.7}
.fo .fa{display:block}
footer{background:#1A1208;border-top:1px solid rgba(245,240,232,0.06);padding:28px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:12px;color:rgba(245,240,232,0.55)}
footer a{color:rgba(245,240,232,0.55);text-decoration:none}
</style>
</head>
<body>{{main}}{{footer}}
<script src="/auping-popup.js"></script>
</body></html>
