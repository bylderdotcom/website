<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#F5F0E8;--cream-2:#EDE6D8;--bark:#1A1208;--bark-2:#3D2E1E;--bark-3:rgba(61,46,30,0.5);--moss:#3D5A3E;--moss-2:#4E7350;--white:#fff;--border:rgba(61,46,30,0.1)}
body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--cream);color:var(--bark-2);line-height:1.65}
nav{background:rgba(245,240,232,0.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;position:fixed;top:0;left:0;right:0;z-index:100;padding:0 5%}
.ni{width:100%;max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.nl{display:flex;align-items:center;gap:10px;text-decoration:none}
.nli{width:32px;height:32px;border-radius:8px;background:#3D5A3E;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;font-family:"Space Mono",monospace;color:#F5F0E8}
.nls{font-weight:800;font-size:17px;letter-spacing:-0.02em;color:#1A1208}.dot{color:#3D5A3E}
.nv{display:flex;align-items:center;gap:4px}
.nk{font-size:14px;color:rgba(61,46,30,0.55);text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500}
.nk:hover{color:#1A1208;background:rgba(61,46,30,0.05)}
.bp{background:#3D5A3E;color:#F5F0E8;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none}
.bp:hover{background:#4E7350}
.c{max-width:1060px;margin:0 auto;padding:0 5%}
.s{padding:72px 0}
.lbl{font-size:11px;font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:0.12em;color:#3D5A3E;font-weight:700;margin-bottom:10px}
.bc{padding:88px 0 0;font-size:13px;color:rgba(61,46,30,0.5)}
.bc a{color:#3D5A3E;text-decoration:none}
.hd{padding:20px 0 64px}
h1{font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:800;color:#1A1208;letter-spacing:-0.03em;line-height:1.1;margin-bottom:14px}
.hs{font-size:16px;color:rgba(61,46,30,0.5);max-width:640px;line-height:1.65;margin-bottom:28px}
.ha{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.bg{background:rgba(45,240,232,0.07);border:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;color:#3D5A3E;border:1.5px solid rgba(61,90,62,0.25);text-decoration:none}
.pc{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px;margin:32px 0;display:flex;gap:32px;flex-wrap:wrap;align-items:center}
.pv{font-size:2.2rem;font-weight:800;color:#1A1208;font-family:"Space Mono",monospace;letter-spacing:-0.03em;line-height:1}
.pl{font-size:12px;color:rgba(61,46,30,0.5);margin-top:4px}
.divider{width:1px;height:40px;background:var(--border)}
.tc{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--border)}
.tc th{background:#EDE6D8;padding:11px 14px;font-size:11px;font-weight:700;font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:0.06em;color:rgba(61,46,30,0.5);text-align:left}
.ai{background:#1A1208;border-radius:16px;padding:32px;margin-top:32px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.at{font-size:1.1rem;font-weight:800;color:#F5F0E8;letter-spacing:-0.02em;margin-bottom:6px}
.as{font-size:13px;color:rgba(245,240,232,0.55);line-height:1.6}
.fi{border-bottom:1px solid var(--border)}
.fq{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:15px;font-weight:700;color:#1A1208;background:none;border:none;cursor:pointer;text-align:left;font-family:"Plus Jakarta Sans",sans-serif;gap:16px}
.fq:hover{color:#3D5A3E}
.fi{font-size:18px;flex-shrink:0;transition:transform 0.2s}
.fa{display:none;padding:0 0 16px;font-size:14px;color:#3D2E1E;line-height:1.7}
.fo .fi{transform:rotate(45deg)}.fo .fa{display:block}
.cs{background:#1A1208;padding:72px 0;text-align:center}
.cs h2{font-size:clamp(1.6rem,2.5vw,2.2rem);font-weight:800;color:#F5F0E8;letter-spacing:-0.03em;margin-bottom:12px}
.cs p{font-size:15px;color:rgba(245,240,232,0.5);max-width:440px;margin:0 auto 28px;line-height:1.65}
footer{background:#1A1208;border-top:1px solid rgba(245,240,232,0.06);padding:28px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:12px;color:rgba(245,240,232,0.3)}
footer a{color:rgba(245,240,232,0.4);text-decoration:none}
@media(max-width:768px){.nv{display:none}}
</style>
</head>
<body>{{main}}{{footer}}
<script>function tf(b){b.closest('.fi').classList.toggle('fo')}</script>
<script src="/auping-popup.js"></script>
</body></html>
