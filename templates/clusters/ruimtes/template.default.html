<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#F5F0E8;color:#3D2E1E;font-family:'Plus Jakarta Sans',sans-serif;line-height:1.7;}
h1,h2,h3{letter-spacing:-0.02em;color:#1A1208;}
a{color:#3D5A3E;}
.container{max-width:1180px;margin:0 auto;padding:0 48px;}
.kruimel{font-size:12.5px;color:rgba(61,46,30,0.72);margin-bottom:16px;}
.kruimel a{color:rgba(61,46,30,0.72);text-decoration:none;}
.kruimel span{margin:0 6px;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(61,90,62,0.1);border:1px solid rgba(61,90,62,0.2);color:#3D5A3E;font-size:12px;font-weight:700;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
h1{font-size:2.5rem;font-weight:800;line-height:1.15;margin:14px 0;}
h2{font-size:1.5rem;font-weight:800;margin:44px 0 10px;}
.lead{font-size:1.1rem;color:rgba(61,46,30,0.72);line-height:1.7;margin-bottom:14px;}
.meta{font-size:12px;color:rgba(61,46,30,0.55);}
.sub{font-size:15px;color:rgba(61,46,30,0.72);margin-bottom:16px;max-width:760px;}
.body{font-size:15px;color:rgba(61,46,30,0.75);line-height:1.75;margin-bottom:13px;max-width:760px;}
.highlight{background:rgba(61,90,62,0.06);border-left:3px solid #3D5A3E;padding:16px 20px;border-radius:0 8px 8px 0;margin:24px 0;font-size:14.5px;color:rgba(61,46,30,0.78);line-height:1.7;}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(200,184,154,0.5),transparent);margin:40px 0;}

/* Beslissingen: de kern van de ontologie. Genummerd, want de volgorde is het punt. */
.besl-lijst{display:flex;flex-direction:column;gap:14px;max-width:860px;}
.besl{display:flex;gap:16px;background:#fff;border:1px solid rgba(61,46,30,0.1);border-radius:16px;padding:20px 22px;}
.besl-nr{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:rgba(61,90,62,0.1);color:#3D5A3E;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;}
.besl h3{font-size:16.5px;font-weight:800;margin-bottom:6px;}
.besl p{font-size:14.5px;color:rgba(61,46,30,0.72);line-height:1.65;}
.opties{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
.optie{font-size:12.5px;color:rgba(61,46,30,0.7);background:#F5F0E8;border:1px solid rgba(61,46,30,0.09);padding:4px 11px;border-radius:999px;}

.x-list{list-style:none;display:flex;flex-direction:column;gap:10px;padding:0;}
.x-list li{position:relative;padding-left:26px;font-size:15px;line-height:1.6;}
.x-list li::before{content:'\2212';color:#B85C38;font-weight:800;position:absolute;left:0;top:0;}
.check-list{list-style:none;display:flex;flex-direction:column;gap:9px;padding:0;}
.check-list li{position:relative;padding-left:24px;font-size:15px;}
.check-list li::before{content:'\2192';color:#3D5A3E;font-weight:700;position:absolute;left:0;top:0;}

.vgl{width:100%;max-width:860px;border-collapse:collapse;font-size:14.5px;margin:18px 0;background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(61,46,30,0.1);}
.vgl th{text-align:left;padding:12px 14px;font-weight:800;font-size:13px;color:#1A1208;background:rgba(61,90,62,0.08);border-bottom:2px solid rgba(61,90,62,0.15);}
.vgl td{padding:11px 14px;border-bottom:1px solid rgba(61,46,30,0.08);vertical-align:top;}
.vgl tr:last-child td{border-bottom:none;}
.vgl td:first-child{font-weight:700;color:#1A1208;}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:8px;}
.tile{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid rgba(61,46,30,0.1);border-radius:14px;padding:16px 18px;transition:border-color .15s;}
.tile:hover{border-color:rgba(61,90,62,0.4);}
.tile-uit{background:rgba(255,255,255,0.5);border-style:dashed;}
.tile-t{font-weight:800;font-size:15.5px;color:#1A1208;margin-bottom:4px;}
.tile-d{font-size:13px;color:rgba(61,46,30,0.7);line-height:1.55;}
.tile-m{font-size:11.5px;color:rgba(61,46,30,0.45);margin-top:7px;font-family:'Space Mono',monospace;}

.faq-item{border-bottom:1px solid rgba(61,46,30,0.08);padding:18px 0;max-width:860px;}
.faq-item h3{font-size:16px;font-weight:700;margin-bottom:8px;}
.faq-item p{font-size:14.5px;color:rgba(61,46,30,0.72);line-height:1.7;}

@media(max-width:768px){
  .container{padding:0 20px;}
  h1{font-size:1.9rem;}
  .grid-3{grid-template-columns:1fr;}
  .besl{flex-direction:column;gap:10px;}
  .vgl{font-size:13px;}
  .vgl th,.vgl td{padding:9px 10px;}
}
/*a11y-focus*/:focus-visible{outline:3px solid #3D5A3E!important;outline-offset:2px;box-shadow:0 0 0 8px rgba(245,240,232,.85)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
