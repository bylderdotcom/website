<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/thin/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#F5F0E8;--cream-2:#EDE6D8;--bark:#1A1208;--bark-2:#3D2E1E;--bark-3:rgba(61,46,30,0.5);--moss:#3D5A3E;--white:#fff;--border:rgba(61,46,30,0.1)}
body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--cream);color:var(--bark-2);line-height:1.65}
nav{background:rgba(245,240,232,0.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;position:fixed;top:0;left:0;right:0;z-index:100;padding:0 5%}
.nav-inner{width:100%;max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo-icon{width:32px;height:32px;border-radius:8px;background:#3D5A3E;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;font-family:"Space Mono",monospace;color:#F5F0E8}
.nav-logo span{font-weight:800;font-size:17px;letter-spacing:-0.02em;color:#1A1208}
.nav-logo .dot{color:#3D5A3E}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{font-size:14px;color:rgba(61,46,30,0.55);text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500}
.nav-link:hover{color:#1A1208;background:rgba(61,46,30,0.05)}
.btn-primary{background:#3D5A3E;color:#F5F0E8;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.btn-primary:hover{background:#4E7350}
.container{max-width:1060px;margin:0 auto;padding:0 5%}
.hero{padding:108px 0 56px}
.breadcrumb{font-size:13px;color:var(--bark-3);margin-bottom:20px}
.breadcrumb a{color:var(--moss);text-decoration:none}
.label{font-size:11px;font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:0.12em;color:var(--moss);font-weight:700;margin-bottom:10px}
h1{font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:800;color:var(--bark);letter-spacing:-0.03em;line-height:1.1;margin-bottom:14px}
.hero-sub{font-size:16px;color:var(--bark-3);max-width:600px;line-height:1.65;margin-bottom:28px}
.search-row{display:flex;gap:12px;margin-bottom:40px;flex-wrap:wrap}
.search-input{padding:11px 16px;border:1.5px solid rgba(61,46,30,0.12);border-radius:10px;font-size:15px;font-family:inherit;color:var(--bark-2);background:#fff;outline:none;min-width:220px;transition:border-color 0.2s}
.search-input:focus{border-color:var(--moss)}
footer{background:#1A1208;border-top:1px solid rgba(245,240,232,0.06);padding:28px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:12px;color:rgba(245,240,232,0.3)}
footer a{color:rgba(245,240,232,0.4);text-decoration:none}
@media(max-width:768px){.nav-links{display:none}}
</style>
</head>
<body>{{main}}{{footer}}

<script>
function filterSteden(q) {
  const items = document.querySelectorAll('#stedenLijst a');
  const divs = document.querySelectorAll('#stedenLijst > div');
  q = q.toLowerCase();
  if (!q) { divs.forEach(d => d.style.display=''); items.forEach(i => i.style.display=''); return; }
  divs.forEach(d => {
    const links = d.querySelectorAll('a');
    let any = false;
    links.forEach(l => { const show = l.textContent.toLowerCase().includes(q); l.style.display = show ? '' : 'none'; if(show) any=true; });
    d.style.display = any ? '' : 'none';
  });
}
</script>
<script src="/auping-popup.js"></script>
</body>
</html>
