<style>
:root{--cream:#F5F0E8;--bark:#1A1208;--moss:#3D5A3E;--rust:#B85C38;--border:rgba(61,46,30,0.12)}
.wi{max-width:820px;margin:0 auto;padding:0 20px}
.wi h1{font-size:clamp(1.7rem,3.4vw,2.6rem);font-weight:800;color:#1A1208;letter-spacing:-.03em;line-height:1.12;margin:0 0 14px}
.wi h2{font-size:clamp(1.25rem,2.2vw,1.6rem);font-weight:800;color:#1A1208;letter-spacing:-.02em;margin:40px 0 12px}
.wi h3{font-size:1rem;font-weight:800;color:#1A1208;margin:22px 0 8px}
.wi p,.wi li{font-size:16px;line-height:1.7;color:rgba(61,46,30,0.72)}
.wi strong{color:#1A1208}
.wi a{color:#3D5A3E}
.wi-kruimel{font-size:13px;color:rgba(61,46,30,0.72);margin:0 0 18px}
.wi-kruimel a{text-decoration:none}
.wi-eyebrow{font-size:11px;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.12em;color:#3D5A3E;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.wi-kort{background:#fff;border:1px solid var(--border);border-left:3px solid #3D5A3E;border-radius:0 12px 12px 0;padding:18px 20px;margin:24px 0}
.wi-kort ul{margin:8px 0 0;padding-left:18px}
.wi-kort li{margin-bottom:5px;font-size:15px}
.wi-cijfers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0}
.wi-cijfer{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px 16px}
.wi-cijfer .w{font-size:22px;font-weight:800;color:#1A1208;letter-spacing:-.02em;line-height:1.2}
.wi-cijfer .l{font-size:12px;color:rgba(61,46,30,0.72);margin-top:3px;line-height:1.4}
.wi-cijfer .v{font-size:11px;font-family:'Space Mono',monospace;margin-top:6px}
.wi-boven{color:#B85C38}.wi-onder{color:#3D5A3E}
table.wi-t{width:100%;border-collapse:collapse;margin:18px 0;font-size:15px}
table.wi-t th{text-align:left;font-size:11px;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:rgba(61,46,30,0.72);border-bottom:1px solid var(--border);padding:8px 10px 8px 0;font-weight:700}
table.wi-t td{padding:9px 10px 9px 0;border-bottom:1px solid var(--border);color:rgba(61,46,30,0.72)}
table.wi-t td:first-child{color:#1A1208;font-weight:600}
.wi-vakken{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.wi-vak{background:#fff;border:1px solid var(--border);border-radius:9px;padding:8px 13px;font-size:13px;color:#1A1208;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.wi-vak b{font-weight:800}
.wi-vak:hover{border-color:rgba(61,90,62,.45)}
.wi-kk{background:#1A1208;border-radius:14px;padding:22px 24px;margin:32px 0;display:flex;gap:16px;align-items:flex-start}
.wi-kk svg{flex-shrink:0;margin-top:2px}
.wi-kk h3{color:#F5F0E8;margin:0 0 6px;font-size:16px}
.wi-kk p{color:rgba(245,240,232,0.55);font-size:14px;margin:0 0 10px;line-height:1.6}
.wi-kk a{color:#F5F0E8;font-weight:700;font-size:14px}
.wi a.wi-cta,.wi-cta{background:#3D5A3E;color:#F5F0E8!important;padding:13px 26px;border-radius:12px;font-weight:800;text-decoration:none;display:inline-flex;font-size:15px;margin:8px 0}
.wi-intro{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px 26px;margin:28px 0}
.wi-intro h2{margin:0 0 8px;font-size:1.2rem}
.wi-intro>p{margin:0 0 16px;font-size:15px}
.wi-vd{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:0 0 18px}
.wi-vd div{display:flex;gap:10px;align-items:flex-start}
.wi-vd svg{flex-shrink:0;margin-top:3px}
.wi-vd b{display:block;color:#1A1208;font-size:14px;font-weight:800;margin-bottom:2px}
.wi-vd span{font-size:13px;line-height:1.55;color:rgba(61,46,30,0.72)}
.wi-gratis{font-size:13px;margin:10px 0 0!important}
.wi-bron{font-size:12px;color:rgba(61,46,30,0.72);border-top:1px solid var(--border);margin-top:36px;padding-top:14px;line-height:1.7}
.wi-faq{margin:8px 0}
.wi-faq details{border-bottom:1px solid var(--border);padding:12px 0}
.wi-faq summary{font-weight:700;color:#1A1208;cursor:pointer;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.wi-faq summary::-webkit-details-marker{display:none}
.wi-faq summary::after{content:'+';font-size:18px;color:#3D5A3E}
.wi-faq details[open] summary::after{content:'\2212'}
.wi-faq p{margin:9px 0 0;font-size:15px}
@media(max-width:600px){.wi-kk{flex-direction:column}}
/*a11y-focus*/:focus-visible{outline:3px solid #3D5A3E!important;outline-offset:2px;box-shadow:0 0 0 8px rgba(245,240,232,.85)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
{{main}}
