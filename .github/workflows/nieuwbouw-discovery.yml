name: Nieuwe nieuwbouwprojecten ontdekken (wekelijks)

# Vindt elke week de nieuw op de markt gekomen nieuwbouwprojecten, verrijkt
# alleen die nieuwe (beleefd: ~2s tussen requests) en scoort ze op
# pagina-waardigheid. Opent een issue met de kandidaten.
#
# Standing order (CLAUDE.md): read-only, reviewbare output, geen auto-publish.
# Deze loop genereert dus GEEN projectpagina's. Waarom niet: 995 bijna-identieke
# pagina's is de dunne-content-val die de kortingscode-pagina's op noindex
# bracht — en die sinds Helpful Content het hele domein meesleept. Een mens
# kiest uit de kandidatenlijst welke projecten een volwaardige pagina krijgen.

on:
  schedule:
    - cron: "0 7 * * 5"   # vrijdag 07:00 UTC, ná de vers-heid-check
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Aantal lijstpagina's om te scannen"
        default: "60"

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan en scoor nieuwe projecten
        run: python3 scripts/nieuwbouw_scraper.py discover "${{ github.event.inputs.max_pages || '60' }}"

      - name: Bouw kandidatentabel
        id: tabel
        run: |
          python3 scripts/report_nieuwe_projecten.py > /tmp/tabel.md
          echo "nieuw=$(python3 -c "import json;print(json.load(open('reports/nieuwe-projecten.json'))['nieuw'])")" >> "$GITHUB_OUTPUT"
          cat /tmp/tabel.md

      - name: Open issue met kandidaten
        if: steps.tabel.outputs.nieuw != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "De wekelijkse scan vond **${{ steps.tabel.outputs.nieuw }}** nieuwe projecten."
            echo
            echo "## Kandidaten (score >= 60)"
            echo
            cat /tmp/tabel.md
            echo
            echo "**Volgende stap:** niets, als het goed is. De poort in \`generate_projectpaginas.py\` bepaalt"
            echo "welke projecten een pagina krijgen, en de publicatieloop (donderdag) zet ze erop."
            echo "Deze lijst is er om te zien wát er binnenkomt, niet om met de hand over te tikken."
            echo "\`bronnen.json\` is alleen nog voor de handgeschreven pagina's; voeg daar niets aan toe."
            echo
            echo "Volledig rapport: \`reports/nieuwe-projecten.json\` (artifact van deze run)."
          } > /tmp/body.md
          # Een label dat niet bestaat laat `gh issue create` falen, en met de
          # `|| true` erachter verdween het alarm dan geruisloos. Dat is precies
          # wat er met de meting van 15 september gebeurde. Daarom eerst zorgen
          # dat het label bestaat.
          gh label create "content-kandidaten" --force >/dev/null 2>&1 || true
          gh issue create \
            --title "Nieuwe nieuwbouwprojecten: ${{ steps.tabel.outputs.nieuw }} gevonden ($(date +%F))" \
            --body-file /tmp/body.md \
            --label "content-kandidaten" \
          || gh issue create \
            --title "Nieuwe nieuwbouwprojecten ($(date +%F))" \
            --body-file /tmp/body.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nieuwe-projecten
          path: reports/nieuwe-projecten.json
          if-no-files-found: ignore
