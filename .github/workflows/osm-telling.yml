name: OSM-telling woonwinkels (eenmalig onderzoek)

# Eenmalig onderzoek (23-10-2026): hoeveel winkels per producttype staan er in
# OpenStreetMap voor heel Nederland? Alleen lezen, schrijft niets. Draait alleen op de
# werktak van de assistent en wordt na het onderzoek weer verwijderd.
on:
  push:
    branches: [claude/stoic-wright-0zidpm]
    paths: [.github/workflows/osm-telling.yml]

permissions:
  contents: read

jobs:
  tel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Tellen via Overpass
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          TAGS = ['bathroom_furnishing','tiles','flooring','carpet','kitchen','lighting','curtain',
                  'window_blind','bed','furniture','paint','interior_decoration','doors','doityourself',
                  'houseware','trade','fireplace','glaziery','windows','hardware','garden_centre','wallpaper']
          def tel(filter_):
              q = ('[out:json][timeout:180];area["ISO3166-1"="NL"][admin_level=2]->.a;'
                   f'nwr{filter_}(area.a);out count;')
              for server in ('https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'):
                  try:
                      r = urllib.request.urlopen(server, data=urllib.parse.urlencode({'data': q}).encode(), timeout=200)
                      return int(json.load(r)['elements'][0]['tags']['total'])
                  except Exception as e:
                      err = e
              return f'fout: {err}'
          print(f"{'shop':24}{'totaal':>8}{'met website':>13}{'met adres':>11}")
          for t in TAGS:
              a = tel(f'["shop"="{t}"]'); time.sleep(2)
              w = tel(f'["shop"="{t}"]["website"]'); time.sleep(2)
              ad = tel(f'["shop"="{t}"]["addr:street"]'); time.sleep(2)
              print(f'{t:24}{a:>8}{w:>13}{ad:>11}', flush=True)
          # gietvloer en binnendeuren hebben geen eigen shop-tag; zoeken op naam
          for naam in ('gietvloer', 'binnendeur', 'kozijn'):
              print(f'naam bevat {naam!r}:', tel(f'["shop"]["name"~"{naam}",i]')); time.sleep(2)
              print(f'  ook craft/office:', tel(f'["name"~"{naam}",i]')); time.sleep(2)
          PY
