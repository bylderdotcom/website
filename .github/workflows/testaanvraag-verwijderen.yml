name: Testaanvraag verwijderen (handmatig)
# Op verzoek van Daniel (21-11-2026). Verwijdert één aanvraag uit de app, en alleen als de naam met
# "TEST" begint. Geen schema, geen andere rijen.
on:
  workflow_dispatch:
    inputs:
      aanvraag_id:
        description: 'Het id van de testaanvraag'
        required: true
permissions:
  contents: read
jobs:
  verwijder:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verwijderen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AANVRAAG_ID: ${{ inputs.aanvraag_id }}
        run: python3 scripts/testaanvraag_verwijderen.py "$AANVRAAG_ID"
