<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3D5A3E" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#3D5A3E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="12%" cy="82%" r="55%">
      <stop offset="0%" stop-color="#B85C38" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#B85C38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="divg" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D5A3E" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3D5A3E"/>
      <stop offset="50%" stop-color="#8AAE8B"/>
      <stop offset="70%" stop-color="#3D5A3E"/>
      <stop offset="100%" stop-color="#3D5A3E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#1A1208"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- logo -->
  <rect x="80" y="72" width="44" height="44" rx="11" fill="#3D5A3E"/>
  <text x="102" y="102" font-family="'Courier New', monospace" font-weight="700" font-size="19" fill="#F5F0E8" text-anchor="middle">B.</text>
  <text x="138" y="103" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="-0.5" fill="#F5F0E8">Bylder<tspan fill="#8AAE8B">.com</tspan></text>

  <!-- label -->
  <rect x="80" y="150" width="270" height="34" rx="17" fill="#3D5A3E" fill-opacity="0.35" stroke="#8AAE8B" stroke-opacity="0.30"/>
  <text x="98" y="172" font-family="'Courier New', monospace" font-weight="700" font-size="13" letter-spacing="1.6" fill="#8AAE8B">AI KOPERSBEGELEIDING</text>

  <!-- slogan -->
  <text x="80" y="296" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="56" letter-spacing="-1.5" fill="#F5F0E8">Bouw aan je droomhuis,</text>
  <text x="80" y="362" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="56" letter-spacing="-1" fill="#8AAE8B">niet aan je rekening.</text>

  <!-- sub -->
  <text x="80" y="438" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#F5F0E8" fill-opacity="0.5">Offerte-check &#183; meerwerkanalyse &#183; kortingsvouchers</text>

  <!-- stat pills -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="840" y="141" width="280" height="104" rx="14" fill="#F5F0E8" fill-opacity="0.06" stroke="#F5F0E8" stroke-opacity="0.10"/>
    <text x="866" y="196" font-weight="800" font-size="30" letter-spacing="-1" fill="#F5F0E8">&#8364;4.200<tspan fill="#8AAE8B">+</tspan></text>
    <text x="866" y="224" font-weight="500" font-size="13" fill="#F5F0E8" fill-opacity="0.42">Gemiddelde besparing per lid</text>

    <rect x="840" y="263" width="280" height="104" rx="14" fill="#F5F0E8" fill-opacity="0.06" stroke="#F5F0E8" stroke-opacity="0.10"/>
    <text x="866" y="318" font-weight="800" font-size="30" letter-spacing="-1" fill="#F5F0E8">40<tspan fill="#8AAE8B">+</tspan></text>
    <text x="866" y="346" font-weight="500" font-size="13" fill="#F5F0E8" fill-opacity="0.42">Woonmerken met korting</text>

    <rect x="840" y="385" width="280" height="104" rx="14" fill="#F5F0E8" fill-opacity="0.06" stroke="#F5F0E8" stroke-opacity="0.10"/>
    <text x="866" y="440" font-weight="800" font-size="30" letter-spacing="-1" fill="#F5F0E8">&#8364;99</text>
    <text x="866" y="468" font-weight="500" font-size="13" fill="#F5F0E8" fill-opacity="0.42">Eenmalig &#183; geen abonnement</text>
  </g>

  <rect x="0" y="627" width="1200" height="3" fill="url(#divg)"/>
